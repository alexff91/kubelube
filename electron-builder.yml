appId: io.github.alexff91.kubelube
productName: Kubelube
copyright: Copyright © 2026 kubelube contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

asarUnpack:
  - node_modules/@kubernetes/client-node/**

npmRebuild: false

publish:
  provider: github
  owner: alexff91
  repo: kubelube

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
