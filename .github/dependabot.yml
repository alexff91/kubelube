version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # electron-vite supports vite ^5 || ^6 || ^7 only; lift these once it
      # gains vite 8 support (and @vitejs/plugin-react 6, which requires it).
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # typescript-eslint does not support TypeScript 6 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
